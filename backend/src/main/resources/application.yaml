spring:
  application:
    name: backend
  main:
    web-application-type: servlet
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  docker:
    compose:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

server:
  port: 8082