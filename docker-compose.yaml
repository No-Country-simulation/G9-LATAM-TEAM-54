services:
  postgres:
    image: postgres:15-alpine
    container_name: energiai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_contrasena
      POSTGRES_DB: energiai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d energiai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app-energi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api-energi-ai
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/energiai_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=tu_contrasena
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: energiai-frontend
    ports:
      - "5173:80"
    depends_on:
      - app-energi
    restart: unless-stopped
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: energiai-adminer
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge