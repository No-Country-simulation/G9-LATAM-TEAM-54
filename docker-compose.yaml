services:
  postgres:
    image: postgres:15-alpine
    container_name: energiai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-energiai_db}

    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d energiai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app-energi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api-energi-ai
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - OCI_ENABLED=${OCI_ENABLED:-false}
      - OCI_TENANCY_OCID=${OCI_TENANCY_OCID}
      - OCI_USER_OCID=${OCI_USER_OCID}
      - OCI_FINGERPRINT=${OCI_FINGERPRINT}
      - OCI_REGION=${OCI_REGION:-sa-saopaulo-1}
      - OCI_PRIVATE_KEY_PATH=/app/secrets/oci_api_key.pem
      - OCI_PASSPHRASE=${OCI_PASSPHRASE:-}
      - OCI_NAMESPACE=${OCI_NAMESPACE}
      - OCI_BUCKET_NAME=${OCI_BUCKET_NAME}
      - OCI_MODEL_OBJECT_NAME=${OCI_MODEL_OBJECT_NAME:-EnergiAI_model.onnx}
    volumes:
      # La clave privada NUNCA se copia dentro de la imagen (Dockerfile);
      # se monta en runtime como solo-lectura desde ./secrets (carpeta ignorada por git).
      - ./secrets/oci_api_key.pem:/app/secrets/oci_api_key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: energiai-frontend
    ports:
      - "5173:80"
    depends_on:
      - app-energi
    restart: unless-stopped
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: energiai-adminer
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge