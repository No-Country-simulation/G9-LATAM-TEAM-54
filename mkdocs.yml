site_name: EnergiAI - Documentación
site_description: Guía técnica y documentación del proyecto EnergiAI
theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: deep orange
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - header.autohide   

markdown_extensions:
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Inicio: index.md
  - API: API.md
  - Arquitectura: ARCHITECTURE.md
  - Progreso: PROGRESS.md
